<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Assests/Css/login.css">
    <title>SE-Project</title>
</head>
<body>
    <div class="loginpage">
  <div class="login-pic-side">
    <div class="frame-2">
      <img class="group" src="../Image/myLogin.svg" />
      <div class="div">
        زیبایی یادگیری در این است که کسی نمی تواند آن را از شما دور کند
      </div>
      <div class="div2">رایلی کینگ -</div>
    </div>
  </div>
  <div class="form">
    <div class="logo">
      <div class="frame-22">
        <div class="div3">سامانه دانشگاهی صبا</div>
        <div class="div4">خوش آمدید</div>
      </div>
      <div class="frame-23">
        <img class="group-1" src="../Image/Frame 2.svg" />
      </div>
    </div>
    <div class="user-name">
      <div class="div5">نام کاربری</div>
      <div class="frame-3">
        <div class="frame-24"></div>
        <img class="mdi-light-account" src="../Image/mdi-light_account.svg" />
      </div>
    </div>
    <div class="pass-word">
      <div class="frame-25">
        <div class="frame-26"></div>
        <div class="div5">کلمه عبور</div>
      </div>
      <div class="frame-3">
        <div class="frame-24"></div>
        <img class="mdi-light-lock" src="../Image/mdi-light_lock.svg" />
      </div>
      <div class="div6">رمز عبور خود را فراموش کرده ام</div>
    </div>
    <div class="capcha">
      <div class="div5">کد امنیتی</div>
      <div class="frame-27">
        <div class="frame-32">
          <div class="frame-5">
            <img class="image-2" src="../Image/image 2.png" />
          </div>
          <img class="mdi-light-refresh" src="../Image/mdi-light_refresh.svg" />
        </div>
        <div class="frame-4"></div>
      </div>
    </div>
    <div class="remember-me">
  <div class="frame-2">
    <div class="div7">مرا به خاطر بسپار</div>
  </div>
  <div class="frame-6"></div>
</div>
    <div class="login-submit">
      <div class="div8">ورود</div>
    </div>
  </div>
</div>
</body>
</html>
